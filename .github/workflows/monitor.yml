name: iPhone 17 Price Monitor

on:
  schedule:
    # Runs every 30 mins between 02:30 UTC (08:00 IST) and 17:30 UTC (23:00 IST)
    - cron: '*/30 2-17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Mark workspace as safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Price Monitor (Croma runs headed under Xvfb for Akamai bypass)
        run: |
          xvfb-run -a npm run monitor

      - name: Commit Updated Price Data & Dashboard
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update price history and dashboard [skip ci]"
          file_pattern: "data/*.json data/*.jsonl dashboard.html reports/*.md"
