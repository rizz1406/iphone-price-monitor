name: Price Monitor (iPhone 17 · Galaxy S25 · S26)

on:
  workflow_dispatch:
  # Note: `schedule` cron triggers are unreliable on GitHub (runs silently dropped).
  # The "Chain next run" step re-dispatches this workflow itself — reliable 24/7 cadence.

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Mark workspace as safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Price Monitor (Croma runs headed under Xvfb for Akamai bypass)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xvfb-run -a npm run monitor

      - name: Determine commit message from alerts
        id: commitmsg
        if: always()
        run: |
          if [ -f data/alert-headline.txt ] && ! grep -q '^no alerts$' data/alert-headline.txt; then
            headline=$(head -c 150 data/alert-headline.txt)
            echo "msg=🔻 $headline [skip ci]" >> "$GITHUB_OUTPUT"
          else
            echo "msg=chore: update price history and dashboard [skip ci]" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Updated Price Data & Dashboard
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.commitmsg.outputs.msg }}
          file_pattern: "data/*.json data/*.jsonl data/alert-headline.txt dashboard.html reports/*.md"

      - name: Chain next run (faster during configured sale windows)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          delay=$(node -e "const c=require('./config.json');const d=new Date().toISOString().slice(0,10);const active=c.products.some(p=>(p.saleCalendar||[]).some(s=>d>=s.start&&d<=s.end));process.stdout.write(String(active?480:1680))")
          sleep $((delay + RANDOM % 120))
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/monitor.yml/dispatches" \
              -d '{"ref":"master"}')
            echo "dispatch attempt $i -> HTTP $code"
            [ "$code" = "204" ] && exit 0
            sleep 60
          done
          echo "::warning::Failed to chain next run — start it again with a manual workflow_dispatch."
          exit 1
